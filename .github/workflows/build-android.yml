name: Build Android APK (Fast Cached)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      auto_export_onnx:
        description: "در صورت نبود فایل .onnx در پوشه weights، مدل‌های YOLO26 به‌صورت خودکار از مخزن مرجع تبدیل و اضافه شوند؟"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.13"

jobs:
  build-android-apk:
    name: Test & Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: 1. دریافت کد پروژه (Checkout)
        uses: actions/checkout@v4

      - name: 2. تنظیم Java JDK 17 (مورد نیاز Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. نصب و کش مدیر بسته فوق‌سریع uv + پایتون 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 4. نصب وابستگی‌های توسعه و اجرای تست‌های خودکار
        run: |
          uv sync --group dev
          uv run pytest -v

      - name: 5. استخراج نسخه دقیق Flutter مورد نیاز Flet
        id: flet_meta
        run: |
          FLUTTER_VER=$(uv run python -c "import flet.version; print(flet.version.flutter_version)")
          echo "flutter_version=${FLUTTER_VER}" >> "$GITHUB_OUTPUT"
          echo "Required Flutter SDK version: ${FLUTTER_VER}"

      - name: 6. نصب و کش Flutter SDK (افزایش چشمگیر سرعت بیلدهای بعدی)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flet_meta.outputs.flutter_version }}
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"

      - name: 7. کش Gradle، Pub، Flet و چرخ‌های اندروید (Multi-Layer Cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.flet
            ~/.cache/pip
          key: ${{ runner.os }}-flet-android-${{ steps.flet_meta.outputs.flutter_version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-flet-android-${{ steps.flet_meta.outputs.flutter_version }}-
            ${{ runner.os }}-flet-android-

      - name: 8. کش اختیاری مدل‌های ONNX (در صورت فعال بودن تبدیل خودکار)
        if: ${{ inputs.auto_export_onnx == true }}
        id: onnx_cache
        uses: actions/cache@v4
        with:
          path: src/weights/*.onnx
          key: yolo26-persian-plate-onnx-v1

      - name: 9. تبدیل خودکار مدل‌های .pt به .onnx (فقط در صورت درخواست و نبود در کش)
        if: ${{ inputs.auto_export_onnx == true && steps.onnx_cache.outputs.cache-hit != 'true' }}
        run: |
          uv run --with ultralytics --with onnx --with onnxslim python scripts/export_onnx.py \
            --download-from-github \
            --output-dir src/weights

      - name: 10. همگام‌سازی و بررسی پوشه weights
        run: |
          mkdir -p src/weights
          if [ -d "weights" ] && ls weights/*.onnx >/dev/null 2>&1; then
            cp -n weights/*.onnx src/weights/ || true
          fi
          echo "=== فایل‌های ONNX داخل بسته اپلیکیشن ==="
          ls -lh src/weights/
          if ! ls src/weights/*.onnx >/dev/null 2>&1; then
            echo "::warning::هیچ فایل .onnx در src/weights یافت نشد! APK ساخته می‌شود اما برای تشخیص پلاک باید فایل‌های ONNX را در src/weights قرار دهید."
          fi

      - name: 11. پذیرش خودکار لایسنس‌های Android SDK
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: 12. ساخت فایل نصبی اندروید (Release APK)
        run: |
          uv run flet build apk --yes --verbose

      - name: 13. آپلود فایل APK نهایی برای دانلود مستقیم
        uses: actions/upload-artifact@v4
        with:
          name: persian-plate-scanner-android-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14
