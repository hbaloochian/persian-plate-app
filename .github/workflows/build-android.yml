name: Build Android APK (Fast Cached)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      auto_export_onnx:
        description: "در صورت نبود فایل .onnx در پوشه weights، مدل‌های YOLO26 به‌صورت خودکار از مخزن مرجع تبدیل و اضافه شوند؟"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.13"

jobs:
  build-android-apk:
    name: Test & Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: 1. دریافت کد پروژه (Checkout)
        uses: actions/checkout@v4

      - name: 2. آزادسازی فضای دیسک سرور (جلوگیری از خطای No space left on device)
        run: |
          echo "=== فضای دیسک قبل از پاک‌سازی ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/local/julia*
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== فضای دیسک بعد از پاک‌سازی ==="
          df -h /

      - name: 3. تنظیم Java JDK 17 (مورد نیاز Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. نصب و کش مدیر بسته فوق‌سریع uv + پایتون 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 5. نصب وابستگی‌های توسعه و اجرای تست‌های خودکار
        run: |
          uv sync --group dev
          uv run pytest -v

      - name: 6. استخراج نسخه دقیق Flutter مورد نیاز Flet
        id: flet_meta
        run: |
          FLUTTER_VER=$(uv run python -c "import flet.version; print(flet.version.flutter_version)")
          echo "flutter_version=${FLUTTER_VER}" >> "$GITHUB_OUTPUT"
          echo "Required Flutter SDK version: ${FLUTTER_VER}"

      - name: 7. نصب و کش Flutter SDK (افزایش چشمگیر سرعت بیلدهای بعدی)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flet_meta.outputs.flutter_version }}
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"

      - name: 8. کش Gradle، Pub، Flet و چرخ‌های اندروید (Multi-Layer Cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.flet
            ~/.cache/pip
          key: ${{ runner.os }}-flet-android-${{ steps.flet_meta.outputs.flutter_version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-flet-android-${{ steps.flet_meta.outputs.flutter_version }}-
            ${{ runner.os }}-flet-android-

      - name: 9. کش اختیاری مدل‌های ONNX (در صورت فعال بودن تبدیل خودکار)
        if: ${{ inputs.auto_export_onnx == true }}
        id: onnx_cache
        uses: actions/cache@v4
        with:
          path: src/weights/*.onnx
          key: yolo26-persian-plate-onnx-v1

      - name: 10. تبدیل خودکار مدل‌های .pt به .onnx با نسخه سبک CPU (فقط در صورت درخواست و نبود در کش)
        if: ${{ inputs.auto_export_onnx == true && steps.onnx_cache.outputs.cache-hit != 'true' }}
        run: |
          trap 'rm -rf /tmp/onnx-export-venv' EXIT
          uv venv /tmp/onnx-export-venv --python 3.13
          uv pip install --python /tmp/onnx-export-venv/bin/python \
            --no-cache --torch-backend=cpu \
            ultralytics onnx onnxslim
          /tmp/onnx-export-venv/bin/python scripts/export_onnx.py \
            --download-from-github \
            --output-dir src/weights

      - name: 11. همگام‌سازی پوشه weights و آیکون برنامه (2.png -> src/assets/icon.png)
        run: |
          mkdir -p src/weights src/assets
          if [ -d "weights" ] && ls weights/*.onnx >/dev/null 2>&1; then
            cp -n weights/*.onnx src/weights/ || true
          fi
          echo "=== فایل‌های ONNX داخل بسته اپلیکیشن ==="
          ls -lh src/weights/
          if ! ls src/weights/*.onnx >/dev/null 2>&1; then
            echo "::warning::هیچ فایل .onnx در src/weights یافت نشد! APK ساخته می‌شود اما برای تشخیص پلاک باید فایل‌های ONNX را در src/weights قرار دهید."
          fi

          # تنظیم خودکار آیکون برنامه در صورت وجود فایل 2.png یا icon.png
          ICON_SRC=""
          for candidate in "2.png" "src/assets/2.png" "assets/2.png" "assets/icon.png"; do
            if [ -f "$candidate" ]; then
              ICON_SRC="$candidate"
              break
            fi
          done
          if [ -n "$ICON_SRC" ]; then
            echo "تنظیم آیکون اپلیکیشن از مسیر: $ICON_SRC"
            uv run python -c "
          from PIL import Image
          with Image.open('${ICON_SRC}') as im:
              rgba = im.convert('RGBA')
              w, h = rgba.size
              if w != h:
                  side = max(w, h)
                  canvas = Image.new('RGBA', (side, side), (0, 0, 0, 0))
                  canvas.paste(rgba, ((side - w) // 2, (side - h) // 2), rgba)
                  rgba = canvas
              rgba.save('src/assets/icon.png', format='PNG')
              rgba.save('src/assets/icon_android.png', format='PNG')
          print('آیکون استاندارد PNG آماده شد:', rgba.size)
          "
          elif [ -f "src/assets/icon.png" ] && [ ! -f "src/assets/icon_android.png" ]; then
            cp -f "src/assets/icon.png" "src/assets/icon_android.png"
          fi

          # دانلود خودکار فونت فارسی Vazirmatn (لایسنس SIL OFL 1.1) جهت تولید گزارش‌های PDF فارسی با کیفیت بالا
          mkdir -p src/assets/fonts
          if [ ! -f "src/assets/fonts/Vazirmatn-Regular.ttf" ]; then
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Regular.ttf" \
              -o "src/assets/fonts/Vazirmatn-Regular.ttf" || rm -f "src/assets/fonts/Vazirmatn-Regular.ttf"
          fi
          if [ ! -f "src/assets/fonts/Vazirmatn-Bold.ttf" ]; then
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Bold.ttf" \
              -o "src/assets/fonts/Vazirmatn-Bold.ttf" || rm -f "src/assets/fonts/Vazirmatn-Bold.ttf"
          fi
          # پشتیبان امن در صورت نبود دسترسی موقت به فونت Vazirmatn
          if [ ! -f "src/assets/fonts/Vazirmatn-Regular.ttf" ] && [ -f "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf" ]; then
            cp -f "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf" "src/assets/fonts/DejaVuSans.ttf"
            cp -f "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" "src/assets/fonts/DejaVuSans-Bold.ttf" || true
          fi
          echo "=== فایل‌های پوشه src/assets و فونت‌های فارسی ==="
          ls -lh src/assets/ src/assets/fonts/

      - name: 12. پذیرش خودکار لایسنس‌های Android SDK
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: 13. تنظیم حافظه بهینه Gradle، پاک‌سازی کاشی و خروجی، و ساخت فایل نصبی اندروید (Release APK)
        run: |
          mkdir -p ~/.gradle
          cat <<'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.vfs.watch=false
          EOF
          echo "=== پاک‌سازی پوشه build و کاشی‌های Gradle/Flet برای جلوگیری از DEX خراب (علامت ClassNotFoundException) ==="
          rm -rf build
          # کاشی Gradle و Flet ممکن است از ساخت‌های قبلی (به‌ویژه در دورهٔ OOM) آسیب‌دیده باشند
          # و DEX خراب را بازتولید کنند — حتماً پاک می‌شوند.
          rm -rf ~/.gradle/caches/build-cache-1
          rm -rf ~/.gradle/caches/transforms-*
          rm -rf ~/.flet
          echo "=== وضعیت حافظه RAM و فضای آزاد دیسک قبل از ساخت APK ==="
          free -h
          df -h /
          uv run flet build apk --yes --verbose

      - name: 14. صدور گواهی معتبر بودن DEX در APK (اصلاح خطای ClassNotFoundException)
        run: |
          echo "=== بررسی فایل‌های DEX در خروجی‌های APK ==="
          APK_FILES=$(ls -1 build/apk/*.apk 2>/dev/null || true)
          if [ -z "$APK_FILES" ]; then
            echo "::error::هیچ فایلی در build/apk یافت نشد!"
            exit 1
          fi
          for apk in $APK_FILES; do
            echo "--- بررسی: $apk ---"
            SIZE=$(stat -c%s "$apk")
            echo "حجم APK: $SIZE بایت"
            if [ "$SIZE" -lt 5000000 ]; then
              echo "::error::APK $apk بسیار کوچک است ($SIZE بایت) — احتمالاً ساخت ناقص. یک APP Flet کامل باید بزرگتر باشد."
              exit 1
            fi
            # بررسی وجود classes.dex و غیرصفر بودن آن (DEX خالی = خرابی کلاس‌های بومی)
            DEX_LIST=$(unzip -l "$apk" 2>/dev/null | grep -E "classes[0-9]*\.dex$" || true)
            if [ -z "$DEX_LIST" ]; then
              echo "::error::APK با نام $apk هیچ فایل DEX (classes*.dex) ندارد! این cause خطای ClassNotFoundException در گوشی است."
              exit 1
            fi
            echo "$DEX_LIST"
            TOTAL_DEX=0
            for dex in $(echo "$DEX_LIST" | awk '{print $4}'); do
              DEX_SIZE=$(unzip -p "$apk" "$dex" 2>/dev/null | wc -c)
              echo "  - $dex : $DEX_SIZE بایت"
              TOTAL_DEX=$((TOTAL_DEX + DEX_SIZE))
              if [ "$DEX_SIZE" -lt 10240 ]; then
                echo "::error::فایل DEX $dex در $apk بیش از حد کوچک ($DEX_SIZE بایت) — احتمالاً خراب است."
                exit 1
              fi
            done
            if [ "$TOTAL_DEX" -lt 500000 ]; then
              echo "::error::کل DEX در $apk بیش از حد کوچک ($TOTAL_DEX بایت مجموع) — ساخت خراب است."
              exit 1
            fi
            echo "::notice::DEX معتبر در $apk تأیید شد ($(echo "$DEX_LIST" | wc -l) فایل، مجموع $TOTAL_DEX بایت)."
          done

      - name: 15. گزارش وضعیت منابع در صورت بروز خطا (تشخیص OOM/دیسک)
        if: failure()
        run: |
          echo "=== حافظه RAM ==="
          free -h || true
          echo "=== فضای دیسک ==="
          df -h / || true
          echo "=== بررسی پیام‌های OOM هسته لینوکس ==="
          sudo dmesg -T 2>/dev/null | grep -iE 'oom|killed|out of memory' | tail -n 20 || true

      - name: 16. آپلود فایل APK نهایی برای دانلود مستقیم
        uses: actions/upload-artifact@v4
        with:
          name: persian-plate-scanner-android-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 17. آپلود فایل‌های ONNX جهت دانلود جداگانه
        uses: actions/upload-artifact@v4
        with:
          name: persian-plate-onnx-models
          path: src/weights/*.onnx
          if-no-files-found: warn
          retention-days: 14
