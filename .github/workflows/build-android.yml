name: Build Android APK (Fast Cached)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      auto_export_onnx:
        description: "در صورت نبود فایل .onnx در پوشه weights، مدل‌های YOLO26 به‌صورت خودکار از مخزن مرجع تبدیل و اضافه شوند؟"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.13"

jobs:
  build-android-apk:
    name: Test & Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: 1. دریافت کد پروژه (Checkout)
        uses: actions/checkout@v4

      - name: 2. آزادسازی فضای دیسک سرور (جلوگیری از خطای No space left on device)
        run: |
          echo "=== فضای دیسک قبل از پاک‌سازی ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/local/julia*
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "=== فضای دیسک بعد از پاک‌سازی ==="
          df -h /

      - name: 3. تنظیم Java JDK 17 (مورد نیاز Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 4. نصب و کش مدیر بسته فوق‌سریع uv + پایتون 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 5. نصب وابستگی‌های توسعه و اجرای تست‌های خودکار
        run: |
          uv sync --group dev
          uv run pytest -v

      - name: 6. استخراج نسخه دقیق Flutter مورد نیاز Flet
        id: flet_meta
        run: |
          FLUTTER_VER=$(uv run python -c "import flet.version; print(flet.version.flutter_version)")
          echo "flutter_version=${FLUTTER_VER}" >> "$GITHUB_OUTPUT"
          echo "Required Flutter SDK version: ${FLUTTER_VER}"

      - name: 7. نصب و کش Flutter SDK (افزایش چشمگیر سرعت بیلدهای بعدی)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flet_meta.outputs.flutter_version }}
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:"

      - name: 8. کش Gradle، Pub، Flet و چرخ‌های اندروید (Multi-Layer Cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.flet
            ~/.cache/pip
          key: ${{ runner.os }}-flet-android-${{ steps.flet_meta.outputs.flutter_version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-flet-android-${{ steps.flet_meta.outputs.flutter_version }}-
            ${{ runner.os }}-flet-android-

      - name: 9. کش اختیاری مدل‌های ONNX (در صورت فعال بودن تبدیل خودکار)
        if: ${{ inputs.auto_export_onnx == true }}
        id: onnx_cache
        uses: actions/cache@v4
        with:
          path: src/weights/*.onnx
          key: yolo26-persian-plate-onnx-v1

      - name: 10. تبدیل خودکار مدل‌های .pt به .onnx با نسخه سبک CPU (فقط در صورت درخواست و نبود در کش)
        if: ${{ inputs.auto_export_onnx == true && steps.onnx_cache.outputs.cache-hit != 'true' }}
        run: |
          trap 'rm -rf /tmp/onnx-export-venv' EXIT
          uv venv /tmp/onnx-export-venv --python 3.13
          uv pip install --python /tmp/onnx-export-venv/bin/python \
            --no-cache --torch-backend=cpu \
            ultralytics onnx onnxslim
          /tmp/onnx-export-venv/bin/python scripts/export_onnx.py \
            --download-from-github \
            --output-dir src/weights

      - name: 11. همگام‌سازی و بررسی پوشه weights
        run: |
          mkdir -p src/weights
          if [ -d "weights" ] && ls weights/*.onnx >/dev/null 2>&1; then
            cp -n weights/*.onnx src/weights/ || true
          fi
          echo "=== فایل‌های ONNX داخل بسته اپلیکیشن ==="
          ls -lh src/weights/
          if ! ls src/weights/*.onnx >/dev/null 2>&1; then
            echo "::warning::هیچ فایل .onnx در src/weights یافت نشد! APK ساخته می‌شود اما برای تشخیص پلاک باید فایل‌های ONNX را در src/weights قرار دهید."
          fi

      - name: 12. پذیرش خودکار لایسنس‌های Android SDK
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: 13. تنظیم حافظه بهینه Gradle و ساخت فایل نصبی اندروید (Release APK)
        run: |
          mkdir -p ~/.gradle
          cat <<'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.vfs.watch=false
          EOF
          echo "=== وضعیت حافظه RAM و فضای آزاد دیسک قبل از ساخت APK ==="
          free -h
          df -h /
          uv run flet build apk --yes --verbose

      - name: 14. گزارش وضعیت منابع در صورت بروز خطا (تشخیص OOM/دیسک)
        if: failure()
        run: |
          echo "=== حافظه RAM ==="
          free -h || true
          echo "=== فضای دیسک ==="
          df -h / || true
          echo "=== بررسی پیام‌های OOM هسته لینوکس ==="
          sudo dmesg -T 2>/dev/null | grep -iE 'oom|killed|out of memory' | tail -n 20 || true

      - name: 15. آپلود فایل APK نهایی برای دانلود مستقیم
        uses: actions/upload-artifact@v4
        with:
          name: persian-plate-scanner-android-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 16. آپلود فایل‌های ONNX جهت دانلود جداگانه
        uses: actions/upload-artifact@v4
        with:
          name: persian-plate-onnx-models
          path: src/weights/*.onnx
          if-no-files-found: warn
          retention-days: 14
